<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>The Blast Beast — Noticias de heavy metal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The Blast Beast: noticias de heavy metal, lanzamientos, conciertos y bandas. Sin relleno."
    />
    <meta name="theme-color" content="#07080a" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="The Blast Beast — RSS"
      href="/feed.xml"
    />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/oswald-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /*
       * El CSS crítico no incluye @font-face, así que estos fallbacks deben
       * estar inline para existir ya en el primer layout. Sus métricas están
       * ajustadas a Oswald/Inter para que el intercambio posterior no cambie
       * el número de líneas ni provoque CLS.
       */
      @font-face {
        font-family: "Inter Fallback";
        font-style: normal;
        font-weight: 400 700;
        font-display: optional;
        src: local("Arial"), local("Liberation Sans");
        size-adjust: 106.77%;
        ascent-override: 88.45%;
        descent-override: 20.81%;
        line-gap-override: 0%;
      }

      @font-face {
        font-family: "Oswald Fallback";
        font-style: normal;
        font-weight: 500 700;
        font-display: optional;
        src: local("Arial"), local("Liberation Sans");
        size-adjust: 79.57%;
        ascent-override: 150.11%;
        descent-override: 34.91%;
        line-gap-override: 0%;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
