<article
  class="group flex h-full flex-col border-t border-line pt-5"
  [class.card-deferred]="!priority()"
>
  <a [routerLink]="['/articulos', article().slug]" class="flex h-full flex-col">
    @if (article().cover; as cover) {
      <div class="mb-4 overflow-hidden rounded-lg border border-line">
        <img
          [src]="coverThumb()"
          [alt]="cover.altText ?? article().title"
          width="480"
          height="320"
          [attr.loading]="priority() ? null : 'lazy'"
          [attr.fetchpriority]="priority() ? 'high' : null"
          decoding="async"
          class="aspect-[3/2] w-full object-cover transition duration-500 group-hover:scale-[1.03]"
        />
      </div>
    }

    <div
      class="flex flex-wrap items-center gap-x-2 gap-y-1 font-mono text-[10px] uppercase tracking-[0.18em]"
    >
      <span class="text-blood-soft">{{ article().category.name }}</span>
      <span aria-hidden="true" class="text-line">/</span>
      <time [attr.datetime]="article().publishedAt" class="text-muted">{{
        published()
      }}</time>
    </div>

    <h3
      class="mt-3 font-display text-xl uppercase leading-[1.12] transition group-hover:text-blood-soft"
    >
      {{ article().title }}
    </h3>

    <p class="mt-3 line-clamp-3 text-sm leading-relaxed text-muted">
      {{ article().excerpt }}
    </p>

    @if (bandNames()) {
      <div
        class="mt-auto flex flex-wrap items-center gap-2 pt-5 font-mono text-[10px] uppercase tracking-[0.16em] text-muted"
      >
        <span class="text-bone/70">{{ bandNames() }}</span>
      </div>
    }
  </a>
</article>
