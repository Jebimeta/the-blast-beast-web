<article
  class="group grid gap-4 border-t border-line py-6 sm:grid-cols-[76px_minmax(0,1fr)_auto] sm:gap-6"
>
  <div>
    <time
      [attr.datetime]="concert().startAt"
      class="inline-flex items-baseline gap-2 rounded-lg border border-line bg-surface px-3 py-2 sm:w-full sm:flex-col sm:items-center sm:gap-0.5 sm:px-2 sm:py-3"
    >
      <span class="font-display text-3xl leading-none text-bone">{{ day() }}</span>
      <span class="font-mono text-[10px] uppercase tracking-[0.18em] text-blood-soft">{{
        month()
      }}</span>
    </time>
  </div>

  <div class="min-w-0">
    <div
      class="flex flex-wrap items-center gap-x-2 gap-y-1 font-mono text-[10px] uppercase tracking-[0.16em]"
    >
      <a
        [routerLink]="['/agenda']"
        [queryParams]="{ genre: concert().genre }"
        class="text-blood-soft hover:underline"
        >{{ concert().genreLabel }}</a
      >
      <span aria-hidden="true" class="text-line">/</span>
      <a
        [routerLink]="['/agenda']"
        [queryParams]="{ city: concert().venue.citySlug }"
        class="text-muted transition hover:text-bone"
        >{{ concert().venue.city }}</a
      >
      <span aria-hidden="true" class="text-line">/</span>
      <span class="text-muted">{{ time() }}</span>
    </div>

    <h3 class="mt-2 font-display text-xl uppercase leading-tight">
      <a
        [routerLink]="['/agenda', concert().slug]"
        class="transition group-hover:text-blood-soft"
        >{{ concert().title }}</a
      >
    </h3>

    @if (artists()) {
      <p class="mt-2 line-clamp-2 text-sm text-muted">{{ artists() }}</p>
    }

    @if (showStatus()) {
      <p
        class="mt-3 inline-flex items-center gap-1.5 rounded-full border border-blood/60 bg-blood/10 px-2.5 py-1 font-mono text-[9px] uppercase tracking-[0.16em] text-blood-soft"
      >
        <span class="size-1 rounded-full bg-blood-soft" aria-hidden="true"></span>
        {{ statusLabel() }}
      </p>
    }
  </div>

  <div class="flex items-end justify-between gap-3 sm:flex-col sm:items-end sm:justify-start">
    @if (price()) {
      <p class="font-mono text-xs text-bone">{{ price() }}</p>
    } @else {
      <p class="font-mono text-[10px] uppercase tracking-[0.14em] text-muted">
        Precio por confirmar
      </p>
    }
    <a [routerLink]="['/agenda', concert().slug]" class="btn-ghost !px-4 !py-2 !text-xs"
      >Ver ficha</a
    >
  </div>
</article>
