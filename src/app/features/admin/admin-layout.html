<main id="contenido" class="shell py-8 sm:py-12">
  <div class="mb-8 flex flex-wrap items-end justify-between gap-4 border-b border-line pb-5">
    <div>
      <p class="eyebrow">Redacción</p>
      <h1 class="mt-2 font-display text-3xl uppercase leading-none sm:text-4xl">
        Panel editorial
      </h1>
    </div>

    <div class="flex items-center gap-4">
      @if (user(); as user) {
        <p class="font-mono text-[10px] uppercase tracking-[0.16em] text-muted">
          {{ user.displayName }} · {{ user.role }}
        </p>
      }
      <button
        type="button"
        class="btn-ghost px-4 py-2 text-xs"
        (click)="logout()"
      >
        Salir
      </button>
    </div>
  </div>

  <div class="grid min-w-0 gap-8 lg:grid-cols-[220px_1fr]">
    <nav
      aria-label="Navegación de redacción"
      class="min-w-0 lg:border-r lg:border-line lg:pr-6"
    >
      <ul class="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:flex lg:flex-col">
        <li>
          <a
            routerLink="/admin/articulos"
            routerLinkActive="border-blood bg-surface-2 text-bone"
            class="flex min-h-11 items-center justify-center whitespace-nowrap rounded-md border border-transparent px-3 py-2.5 text-center font-display text-sm uppercase tracking-wider text-muted transition hover:border-line hover:text-bone lg:justify-start lg:px-4 lg:py-3 lg:text-left"
          >
            Artículos
          </a>
        </li>
        <li>
          <a
            routerLink="/admin/radar"
            routerLinkActive="border-blood bg-surface-2 text-bone"
            class="flex min-h-11 items-center justify-center whitespace-nowrap rounded-md border border-transparent px-3 py-2.5 text-center font-display text-sm uppercase tracking-wider text-muted transition hover:border-line hover:text-bone lg:justify-start lg:px-4 lg:py-3 lg:text-left"
          >
            Radar
          </a>
        </li>
        <li>
          <a
            routerLink="/admin/taxonomia"
            routerLinkActive="border-blood bg-surface-2 text-bone"
            class="flex min-h-11 items-center justify-center whitespace-nowrap rounded-md border border-transparent px-3 py-2.5 text-center font-display text-sm uppercase tracking-wider text-muted transition hover:border-line hover:text-bone lg:justify-start lg:px-4 lg:py-3 lg:text-left"
          >
            Taxonomía
          </a>
        </li>
        <li>
          <a
            routerLink="/admin/medios"
            routerLinkActive="border-blood bg-surface-2 text-bone"
            class="flex min-h-11 items-center justify-center whitespace-nowrap rounded-md border border-transparent px-3 py-2.5 text-center font-display text-sm uppercase tracking-wider text-muted transition hover:border-line hover:text-bone lg:justify-start lg:px-4 lg:py-3 lg:text-left"
          >
            Medios
          </a>
        </li>
        <li>
          <a
            routerLink="/admin/contactos"
            routerLinkActive="border-blood bg-surface-2 text-bone"
            class="flex min-h-11 items-center justify-center whitespace-nowrap rounded-md border border-transparent px-3 py-2.5 text-center font-display text-sm uppercase tracking-wider text-muted transition hover:border-line hover:text-bone lg:justify-start lg:px-4 lg:py-3 lg:text-left"
          >
            Contactos
          </a>
        </li>
        <li>
          <a
            routerLink="/admin/cuenta"
            routerLinkActive="border-blood bg-surface-2 text-bone"
            class="flex min-h-11 items-center justify-center whitespace-nowrap rounded-md border border-transparent px-3 py-2.5 text-center font-display text-sm uppercase tracking-wider text-muted transition hover:border-line hover:text-bone lg:justify-start lg:px-4 lg:py-3 lg:text-left"
          >
            Cuenta
          </a>
        </li>
      </ul>

      <div class="mt-2 lg:mt-6 lg:border-t lg:border-line lg:pt-5">
        <a
          routerLink="/"
          class="flex min-h-10 items-center justify-center rounded-md border border-line px-4 font-mono text-[10px] uppercase tracking-[0.16em] text-muted transition hover:border-muted hover:text-bone lg:min-h-0 lg:justify-start lg:border-0 lg:px-0 lg:py-0"
          >Ver el portal →</a
        >
      </div>
    </nav>

    <div class="min-w-0">
      <router-outlet />
    </div>
  </div>
</main>
