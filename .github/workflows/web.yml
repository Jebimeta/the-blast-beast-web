name: Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test -- --watch=false

      - name: Build de producción (SSR)
        run: npm run build

      - name: Presupuesto de bundle
        run: |
          echo "Tamaños generados:"
          du -sh dist/the-blast-beast-web/browser || true

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/the-blast-beast-web/
          retention-days: 7

  e2e:
    name: E2E, accesibilidad y Lighthouse
    runs-on: ubuntu-latest
    env:
      API_CONTEXT: ./the-blast-beast-api
      E2E_PORT: '8088'
    steps:
      - uses: actions/checkout@v4

      # El stack e2e necesita la API y su seed de desarrollo. Si el repo es
      # privado, define el secret API_REPO_TOKEN con permiso de lectura.
      - name: Checkout de la API
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/the-blast-beast-api
          path: the-blast-beast-api
          token: ${{ secrets.API_REPO_TOKEN || github.token }}

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Levantar el stack completo
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Esperar a que API y web respondan
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8088/api/v1/ping > /dev/null \
              && curl -fsS http://localhost:8088/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.e2e.yml logs --no-color
          exit 1

      - name: Playwright (público, redacción y axe)
        run: npm run e2e

      - name: Lighthouse (rendimiento, SEO y accesibilidad)
        run: npm run lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Publicar informes de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            playwright-report/
            test-results/
            reports/lighthouse/
          retention-days: 7

      - name: Logs del stack
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Parar el stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  image:
    name: Imagen Docker
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR exige nombres de repositorio en minúsculas y `github.repository`
      # conserva las mayúsculas del owner (`Jebimeta/...`).
      - name: Normalizar nombre de la imagen
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
